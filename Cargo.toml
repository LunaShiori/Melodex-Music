[workspace]
resolver = "2"
members = ["crates/melodex-core", "crates/vendor/umc_utils", "crates/vendor/umc_qmc"]
exclude = ["src-tauri"]

[workspace.package]
version = "1.1.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
authors = ["Melodex Contributors"]
repository = "https://github.com/LunaShiori/melodex"
homepage = "https://github.com/LunaShiori/melodex"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
