[workspace]
resolver = "2"
members = ["crates/melodex-core"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
authors = ["Melodex Contributors"]
repository = "https://github.com/melodex-app/melodex"
homepage = "https://github.com/melodex-app/melodex"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
