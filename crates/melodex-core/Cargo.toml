[package]
name = "melodex-core"
description = "Melodex 共享核心：多源聚合搜索与下载引擎"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["music", "downloader", "aggregator", "netease", "tauri"]
categories = ["multimedia::audio", "network-programming"]

[features]
default = ["net", "tls"]
# 网络音源能力（HTTP 客户端、音源适配器、聚合与下载引擎）
net = [
  "dep:tokio",
  "dep:reqwest",
  "dep:async-trait",
  "dep:futures-util",
  "dep:percent-encoding",
  "dep:tokio-tungstenite",
]
# TLS 后端。默认开启 rustls；裁剪时（例如自建 http 中继）可关闭以减小体积。
# WebSocket 的 TLS 也挂在这里：关掉 tls 时 MQTT 仍能编译，只是连不上 wss。
tls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# 凭据库加密（纯 Rust，无 C 依赖，不参与 net 特性门控）
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
# 二维码渲染成 SVG（关闭 image 特性，避免引入图像编解码与 C 依赖）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "fs", "io-util", "macros"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "charset"], optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
percent-encoding = { version = "2", optional = true }
# QQ 音乐扫码登录的 MQTT over WebSocket 通道（只用到 CONNECT/SUBSCRIBE/PUBLISH）
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "connect",
  "handshake",
], optional = true }

[[example]]
name = "probe"
required-features = ["net"]
