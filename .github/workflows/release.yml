name: release

# 打 tag 即出安装包：
#   git tag v0.1.0 && git push origin v0.1.0
# 产物：Windows 的 NSIS(.exe) / MSI(.msi) 与 Android 的通用 APK，自动挂到 Release 上。
# 应用内「检查更新」读的就是这个 Release 的 latest，所以文件必须挂在 Release 资产里。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0）'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建桌面端（NSIS + MSI）
        run: npm run tauri build

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Recurse -Path src-tauri/target/release/bundle -Include *.exe,*.msi |
            Copy-Item -Destination out
          # productName 改成了「Melodex Music」，打包器会照着它命名安装包，
          # 文件名里带空格在下载链接里会变成 %20，命令行安装也要加引号，很别扭。
          # 这里只改文件名，安装后「应用和功能」里显示的名字仍然是 Melodex Music。
          Get-ChildItem out -File | ForEach-Object {
            $new = $_.Name -replace '^Melodex( Music)?_', 'MelodexMusic_'
            if ($new -ne $_.Name) { Rename-Item $_.FullName $new }
          }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: out/*
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：它内部会执行 `sdkmanager tools`，
      # 而当前镜像已不再提供 `tools` 包，会直接失败。ubuntu 运行器本来就预装了 SDK。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # 逐个安装，避免某个包不存在导致整批失败；AGP 构建时还会按需自动补齐
          for pkg in "platform-tools" \
                     "platforms;android-34" "platforms;android-35" "platforms;android-36" \
                     "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0"; do
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" > /dev/null 2>&1 \
              && echo "installed $pkg" || echo "skip $pkg"
          done

      - name: 安装 NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: 配置 NDK 环境变量
        run: |
          echo "NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 生成 Android 工程
        run: npm run tauri android init

      # init 生成的工程只带 Tauri 官方默认图标（黄青色图案），
      # 构建时不会自动搬运 src-tauri/icons/android，必须显式覆盖进去。
      - name: 同步启动图标
        run: python3 scripts/android-icons.py

      # Android 7 起不允许把 file:// 交给别的应用，安装自己下载的 APK 必须有
      # FileProvider + REQUEST_INSTALL_PACKAGES 权限，这两样 gen/android 里没有。
      # 脚本会 fail-fast：注入不完整就让构建挂掉，别发一个安装按钮点不动的包。
      - name: 注入 APK 安装插件
        run: python3 scripts/android-apk-plugin.py

      - name: 配置 release 签名
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 默认用仓库内公开的 CI 密钥（保证历次 Release 签名一致，可覆盖升级）。
          # 配了 ANDROID_KEY_BASE64 + ANDROID_KEY_PASSWORD 则用你的私钥，上架商店请这样做。
          if [ -n "$KEY_BASE64" ]; then
            echo "使用 secrets 中的自有密钥"
            echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/melodex.p12"
            PASS="$KEY_PASSWORD"
            ALIAS="${KEY_ALIAS:-melodex}"
          else
            echo "使用仓库内置 CI 密钥"
            cp src-tauri/ci-signing/melodex-ci.p12 "$RUNNER_TEMP/melodex.p12"
            PASS="melodex-ci"
            ALIAS="melodex"
          fi

          cd src-tauri/gen/android
          {
            echo "storeFile=$RUNNER_TEMP/melodex.p12"
            echo "storeType=PKCS12"
            echo "keyAlias=$ALIAS"
            echo "password=$PASS"
          } > keystore.properties

          cd "$GITHUB_WORKSPACE"
          python3 scripts/android-signing.py

      - name: 构建通用 APK
        run: npm run tauri android build -- --apk

      - name: 整理并校验产物
        run: |
          mkdir -p out
          # Gradle 产出的名字固定叫 app-universal-release.apk，下载到本地后无法区分版本，
          # 这里统一重命名为 MelodexMusic_<版本>_universal.apk。
          version="${GITHUB_REF_NAME#v}"
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "未找到 APK 产物" >&2
            exit 1
          fi
          cp "$apk" "out/MelodexMusic_${version}_universal.apk"
          ls -lh out
          python3 scripts/check-apk.py out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    name: 发布 Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lh dist-artifacts

      # Release 页面要能直接看到「这一版改了什么」，不能只有安装说明。
      # 更新内容统一维护在 CHANGELOG.md，这里按 tag 把对应段落抽出来。
      - name: 提取本版本更新内容
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 每个版本以 "## v1.2.3" 开头，取到下一个 "## " 之前；### 子标题不算
          awk -v head="## v${version}" '
            index($0, head) == 1 { hit = 1; next }
            hit && /^## / { exit }
            hit { print }
          ' CHANGELOG.md > version-notes.md
          if [ -s version-notes.md ]; then
            echo "已提取 v${version} 的更新内容：$(wc -l < version-notes.md) 行"
            head -n 5 version-notes.md
          else
            echo "::warning::CHANGELOG.md 里没有 v${version} 段落，发布说明将只含安装信息"
          fi

      - name: 生成发布说明（更新内容 + 安装方式 + 实际产物清单）
        run: |
          {
            if [ -s version-notes.md ]; then
              echo "## 本次更新"
              echo
              cat version-notes.md
              echo
              echo "---"
              echo
            fi
            cat .github/release-body.md
            echo
            echo "### 本次构建产物"
            echo
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for f in dist-artifacts/*; do
              [ -f "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "完整更新历史见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。"
          } > release-body.md
          echo "--- 发布说明预览 ---"
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # 标题统一成「Melodex Music vX.Y.Z」：带上 music，且不再拖
          # 「· Windows 安装包 + Android APK」这种长尾巴，列表里一眼能扫完
          name: Melodex Music ${{ github.ref_name }}
          draft: false
          prerelease: false
          # 自己拼好的说明已经包含更新内容；关掉自动 notes，
          # 否则会追加一长串 commit 标题，把真正的更新说明淹掉。
          generate_release_notes: false
          body_path: release-body.md
          files: dist-artifacts/*
          fail_on_unmatched_files: true
