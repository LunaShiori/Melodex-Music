name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心（测试 + 静态检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/melodex-core

      - name: 纯逻辑测试（不依赖网络层）
        run: cargo test -p melodex-core --no-default-features

      - name: 含网络层的全量测试
        run: cargo test -p melodex-core --features net

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p melodex-core --features net -- -D warnings

  shell:
    name: 外壳（Tauri 编译检查）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! 要求 frontendDist 目录真实存在，
      # 这里放个占位即可，检查外壳的 Rust 代码不需要真的构建前端。
      - name: 准备占位前端产物
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html>'
        shell: pwsh

      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 5
