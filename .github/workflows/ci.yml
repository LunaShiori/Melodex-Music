name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心（测试 + 静态检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/melodex-core

      - name: 纯逻辑测试（不依赖网络层）
        run: cargo test -p melodex-core --no-default-features

      - name: 含网络层的全量测试
        run: |
          if cargo test -p melodex-core --features net > /tmp/core-test.log 2>&1; then
            tail -n 5 /tmp/core-test.log
            exit 0
          fi

          echo "::error::核心测试失败（此行为诊断标记）"

          # Actions 日志要仓库权限才能下载，把关键行发到公开 paste 便于定位。
          # 两个服务互为备份，都不通时至少还剩 annotation 与 tail。
          link=$(curl -sS --max-time 20 --data-binary @/tmp/core-test.log https://paste.rs 2>/dev/null || true)
          if [ -z "$link" ] || ! echo "$link" | grep -q '^https\?://'; then
            link=$(curl -sS --max-time 20 -F "file=@/tmp/core-test.log" https://0x0.st 2>/dev/null || true)
          fi
          if echo "$link" | grep -q '^https\?://'; then
            echo "::error::失败日志：$link"
          fi

          grep -E "panicked at|error\[E|^error|FAILED|left:|right:" /tmp/core-test.log | head -8 \
            | cut -c1-300 | sed 's/^/::error::/'
          exit 1

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p melodex-core --features net -- -D warnings

  shell:
    name: 外壳（Tauri 编译检查）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! 要求 frontendDist 目录真实存在，
      # 这里放个占位即可，检查外壳的 Rust 代码不需要真的构建前端。
      - name: 准备占位前端产物
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Value '<!doctype html>'
        shell: pwsh

      - name: 编译检查
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | Tee-Object -FilePath check.log
          if ($LASTEXITCODE -ne 0) {
            # 失败原因打成 annotation：Actions 日志需要仓库权限，注解是公开可读的
            Select-String -Path check.log -Pattern '^error(\[|:)' -Context 0,6 |
              Select-Object -First 12 |
              ForEach-Object { ($_.ToString() -split "`r?`n") } |
              ForEach-Object { "::error::$($_ -replace '%','%25')" }
            exit 1
          }
        shell: pwsh

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 5
